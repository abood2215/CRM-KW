server {
    listen 80;
    server_name crm.motmaina-center.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name crm.motmaina-center.com;
    ssl_certificate /etc/letsencrypt/live/crm.motmaina-center.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.motmaina-center.com/privkey.pem;

    root /var/www/crm-kw/REACT_CRM_dist;
    index index.html;

    # Storage files (symlink: LARAVEL CRM/storage/app/public → laravel-storage)
    location ^~ /storage/ {
        alias /var/www/crm-kw/laravel-storage/;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Laravel API
    location ^~ /api {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/crm-kw/laravel-public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param SERVER_NAME $server_name;
        fastcgi_param SERVER_PORT $server_port;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param HTTPS on;
        include fastcgi_params;
    }

    # Reverb WebSocket
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /apps {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
